[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nucontrol"
version = "0.1.0"
description = "Query nuPlan scenarios and generate alternative routes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
    { name = "Marlon Steiner", email = "marlon.steiner@kit.edu" }
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    # NOTE: nuplan-devkit itself is installed separately with --no-deps (see README) so its heavy
    # torch/ray/bokeh/jupyter stack is skipped. The libs below are the only runtime deps the
    # nuplan map + scenario-builder code paths actually need.
    "numpy==1.23.4",
    "scipy>=1.13.1",
    "shapely>=2.0.0",
    "geopandas>=0.12.1",
    "pandas>=2.1.0",
    "pyarrow>=9.0.0",
    "pyogrio>=0.11.1",
    "rasterio>=1.4.0rc1",
    "fiona>=1.10.1",
    "pyproj",
    "pyquaternion>=0.9.5",
    "opencv-python<=4.5.1.48",
    "rtree>=1.4.1",
    "sqlalchemy==1.4.27",
    "cachetools>=5.2.0",
    "ujson>=5.11.0",
    "retry>=0.9.2",
    "requests>=2.28.1",
    "psutil>=7.2.2",
    "aioboto3>=11.0.1",
    "boto3==1.24.59",
    "tqdm>=4.64.0",
    "pyyaml>=6.0",
    # nuplan imports these unconditionally at module-load time (sensor/lidar utils), even though
    # the map/scenario code paths don't use them:
    "pillow>=9.2.0",
    "matplotlib>=3.9.4",
    "pytest>=8.4.2",
]

[project.scripts]
nucontrol-generate-routes = "nucontrol.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nucontrol*"]

[tool.setuptools]
include-package-data = true
